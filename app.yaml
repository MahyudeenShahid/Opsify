runtime: python311

instance_class: F2

env_variables:
  GEMINI_API_KEY: "REPLACE_WITH_YOUR_KEY"
  OPSIFY_API_KEY: "REPLACE_WITH_YOUR_KEY"
  GOOGLE_MAPS_API_KEY: "REPLACE_WITH_YOUR_KEY"
  GOOGLE_SERVICE_ACCOUNT_PATH: "service_account.json"
  GOOGLE_SHEETS_NAME: "Opsify Inventory Sync"
  # For Firebase - set this to the path of your service account JSON
  # FIREBASE_SERVICE_ACCOUNT_PATH: "firebase-adminsdk.json"

entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2

handlers:
  - url: /.*
    script: auto
    secure: always
